  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

  <!-- EN: Google Fonts with display=swap
         AR: خطوط جوجل مع display=swap -->

    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cormorant+Garamond:wght@500;700&display=swap"

  <!-- JSON-LD: Organization + WebSite with SearchAction -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://online-store-ghsaan.vercel.app",
      "logo": "https://online-store-ghsaan.vercel.app/Logo_192.png",
      "name": "Smart Shopper | المتسوق الذكي",
      "description": "المتسوق الذكي — متجرك الإلكتروني لمنتجات متنوعة بأسعار منافسة وتجربة تسوق سهلة",
      "sameAs": []
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Smart Shopper | المتسوق الذكي",
      "url": "https://online-store-ghsaan.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://online-store-ghsaan.vercel.app/products?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <!--
      EN: ANTI-FLICKER SCRIPT — runs BEFORE React hydrates to prevent FOUC in dark mode.
      AR: سكريبت مضاد للوميض — يعمل قبل تفعيل React لمنع الوميض الأبيض.
  -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
        var lang = localStorage.getItem('preferred_language');
        if (lang === 'en') {
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('dir', 'ltr');
        } else {
          document.documentElement.setAttribute('lang', 'ar');
          document.documentElement.setAttribute('dir', 'rtl');
        }
      } catch (e) { }
    })();
  </script>

  <!-- EN: Inline critical CSS for the Suspense fallback spinner.
         AR: CSS حرج مضمّن لمؤشر التحميل. -->
  <style>
    #root { min-height: 100vh; }
    .border-3 { border-width: 3px; }
  </style>
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
